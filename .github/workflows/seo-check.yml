name: SEO check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate SEO metadata (titles, descriptions, OG, duplicates)
        run: bunx vitest run src/test/seo.test.tsx
      - name: Full test suite
        run: bun run test
